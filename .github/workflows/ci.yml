name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila, ejecuta tests unitarios y de integración (Testcontainers usa el Docker del runner)
      # y comprueba con JaCoCo la cobertura mínima del paquete disponibilidad
      - name: Compilar, testear y medir cobertura
        run: ./mvnw -B verify

      # Informe HTML de cobertura descargable desde la ejecución del CI
      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # En local los tests de integración se omiten si no hay Docker; en el CI deben ejecutarse siempre
      - name: Comprobar que no se ha omitido ningún test de integración
        run: |
          if grep -l 'skipped="[1-9]' target/surefire-reports/TEST-*IntegrationTest.xml; then
            echo "::error::Hay tests de integración omitidos en el CI"
            exit 1
          fi

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --watch=false

      - name: Build de producción
        run: npm run build

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Comprueba que los Dockerfile siguen construyendo (no se publican)
      - name: Construir la imagen del backend
        run: docker build -t reservas-backend backend

      - name: Construir la imagen del frontend
        run: docker build -t reservas-frontend frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Secretos de usar y tirar, generados en cada ejecución: no hay ninguno en el repositorio
      - name: Generar secretos de prueba
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      # La aplicación completa, igual que en local: PostgreSQL, Mailpit, backend y Nginx
      - name: Levantar la aplicación con Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Comprobar tipos
        working-directory: e2e
        run: npm run lint

      - name: Tests e2e
        working-directory: e2e
        run: npm test

      - name: Logs del backend si algo falla
        if: failure()
        run: docker compose logs backend

      - name: Subir el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: e2e/playwright-report/
          if-no-files-found: ignore
