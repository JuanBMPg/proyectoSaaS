name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila, ejecuta tests unitarios y de integración (Testcontainers usa el Docker del runner)
      - name: Compilar y testear
        run: ./mvnw -B verify

      # En local los tests de integración se omiten si no hay Docker; en el CI deben ejecutarse siempre
      - name: Comprobar que no se ha omitido ningún test de integración
        run: |
          if grep -l 'skipped="[1-9]' target/surefire-reports/TEST-*IntegrationTest.xml; then
            echo "::error::Hay tests de integración omitidos en el CI"
            exit 1
          fi

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --watch=false

      - name: Build de producción
        run: npm run build
