spring:
  application:
    name: reservas

  # En local lee el .env de la raíz del repo (o del directorio actual).
  # En Docker o en producción las variables llegan como variables de entorno reales.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservas}
    username: ${DB_USERNAME:reservas}
    password: ${DB_PASSWORD:}

  jpa:
    # Flyway es el único dueño del esquema; Hibernate solo comprueba que coincide
    hibernate:
      ddl-auto: validate
    # Evita consultas perezosas ocultas durante el renderizado de la respuesta
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}
  # Detrás de un proxy HTTPS (el de la plataforma de hosting, a través de Nginx): Tomcat toma el
  # esquema de X-Forwarded-Proto, pero solo si la petición viene de una IP interna (el proxy), así
  # nadie de fuera puede falsearlo. Sin esto el backend se creería en http y vería un origen
  # distinto en cada POST del navegador (403 de CORS).
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Configuración propia de la aplicación (ver config/AppProperties)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  # true: al arrancar crea el negocio de demostración si no existe (ver demo/DatosDemo)
  demo:
    habilitada: ${DEMO:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-responder@reservas.local}
  # Cola de emails (outbox): cada cuánto se envían los pendientes
  emails:
    intervalo: PT10S
  # Recordatorio de las citas confirmadas, con esta antelación
  recordatorios:
    antelacion: PT24H
    intervalo: PT5M
  auth:
    # Vacío por defecto: la validación de AuthProperties impide arrancar sin JWT_SECRET
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: reservas
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
