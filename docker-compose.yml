# La aplicación completa con un comando. Copia .env.example a .env, rellena DB_PASSWORD y
# JWT_SECRET, y:
#
#   docker compose up --build         → toda la aplicación en http://localhost:8081
#                                        (con el negocio de demostración /peluqueria-lola)
#   docker compose up -d postgres mailpit
#                                      → solo la infraestructura, para desarrollar con
#                                        mvnw spring-boot:run y npm start

services:
  postgres:
    image: postgres:16-alpine
    container_name: reservas-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-reservas}
      POSTGRES_USER: ${DB_USERNAME:-reservas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el fichero .env}
      # Coherente con la regla del proyecto: todo instante en UTC
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: reservas-mailpit
    ports:
      - "${MAIL_PORT:-1025}:1025"   # SMTP: aquí envía el backend
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Interfaz web para ver los emails
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: reservas-backend
    # Sin puerto publicado: solo se llega a través de Nginx (servicio frontend)
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-reservas}
      DB_USERNAME: ${DB_USERNAME:-reservas}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-responder@reservas.local}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el fichero .env}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8081}
      DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  frontend:
    build: ./frontend
    container_name: reservas-frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
